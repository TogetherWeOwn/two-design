# The merge gate for the design system.
#
# Two gates, both blocking, both from the Designer (TWO-19), both plain Node with
# zero dependencies — so the whole thing is well under a minute and nobody is ever
# tempted to route around it.
#
# The job id is `tests` on purpose. Branch protection matches a required check
# against the *job id*, not the workflow name, and `tests` is the name the org's
# setup script requires across our repos (TWO-39). One id, every repo, no surprises.
#
# CI standard: run only what the change affects, plus a full run on main and nightly.
#
#   changes   native `git diff --name-only` against the merge base; no third-party action.
#   tests     the two gates below. Gated at job level on `changes.outputs.code`.
#   ci-ok     the one aggregator branch protection should require, next to `pr-lint` and
#             `gitleaks`. A skipped job counts as success here, so a docs-only PR never blocks
#             on a skipped check, and it fails closed when change detection did not succeed.
#
# This repo has a single code area, so the only skip is docs-only. A PR is docs-only when every
# changed file is markdown, under docs/, or a LICENSE file, and nothing under .github/ changed.
# Everything else runs the gates: package.json (dependencies), tokens/, tools/, preview/,
# assets/ and .github/** (this filter included). Pushes to main, the nightly schedule and manual
# dispatch always run everything.
#
# Never add `paths:` or `paths-ignore:` to the triggers below. A workflow that is skipped at the
# trigger level never reports `ci-ok`, and a required check that never reports blocks the merge.
name: CI

on:
  pull_request:
    # Retargeting changes the merge base without changing the head; recompute the gates.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # Manual route: dispatch on a branch to run the full gates on its head commit. Those runs are
  # not in a PR's status rollup, so they do not satisfy a PR's required check.
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Change detection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event ($EVENT): full run"
            exit 0
          fi
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          files="$(git -c core.quotePath=false diff --name-only --no-renames "$merge_base" "$HEAD_SHA")"
          echo "changed files:"
          echo "$files"
          code=false
          if [ -z "$files" ]; then
            code=true
          else
            while IFS= read -r f; do
              case "$f" in
                .github/*) code=true ;;
                *.md | docs/* | LICENSE | LICENSES/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  tests:
    name: tests
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # fetch-depth is irrelevant here but the checkout must be a real working tree,
      # because the second gate is a `git diff` against it.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: CI retargeting regression
        run: node --test tools/ci-retarget.test.mjs

      # There are no dependencies, and that is a feature worth defending. If a
      # package.json ever grows one, this step starts failing and someone has to
      # decide deliberately rather than by drift.
      - name: No dependencies
        run: |
          if node -e "const p=require('./package.json'); process.exit((p.dependencies||p.devDependencies) ? 1 : 0)"; then
            echo "zero dependencies, as designed"
          else
            echo "::error::two-design has grown a dependency. That was a deliberate zero — see README before removing this check."
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Gate 1 — WCAG 2.2 AA contrast.
      #
      # The script parses the hex values straight out of tokens/two.css; it keeps
      # no copy of its own, so it cannot go stale. It exits non-zero on any
      # failing pairing. Verified by QA against a deliberately darkened
      # --ink-muted: 39/43, exit 1, naming all four broken pairings.
      # ---------------------------------------------------------------------
      #
      # `set -o pipefail` is load-bearing. GitHub's default shell is `bash -e`, not
      # `bash -eo pipefail`, so `node ... | tee` reports tee's exit status and a
      # failing contrast check would print FAIL in the log and pass the step. A gate
      # that cannot go red is not a gate.
      - name: Contrast — WCAG 2.2 AA
        run: |
          set -o pipefail
          node tools/check-contrast.mjs | tee contrast.txt

      # A non-zero exit is not the only way this gate can be defeated. Deleting a
      # pairing from the assertion list makes a failure disappear and prints a
      # smaller, still-green total. So the count is a floor, not just a pass/fail.
      #
      # Raising MINIMUM_PAIRINGS when the system genuinely grows is expected and
      # welcome. Lowering it is a design decision that needs saying out loud in the
      # PR, not a silent edit that makes the gate weaker while it still says PASS.
      - name: Contrast coverage has not shrunk
        env:
          MINIMUM_PAIRINGS: '43'
        run: |
          asserted=$(grep -oE '[0-9]+/[0-9]+ pairings pass' contrast.txt | cut -d/ -f2 | cut -d' ' -f1)
          if [ -z "$asserted" ]; then
            echo "::error::could not read the pairing count out of check-contrast.mjs output — the gate cannot prove anything"
            exit 1
          fi
          echo "asserted $asserted pairings, floor is $MINIMUM_PAIRINGS"
          if [ "$asserted" -lt "$MINIMUM_PAIRINGS" ]; then
            echo "::error::contrast coverage dropped from $MINIMUM_PAIRINGS to $asserted pairings. A pairing was deleted, not fixed. Removing a colour combination the system no longer uses is fine — say so in the PR and lower the floor in the same commit."
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Gate 2 — the preview cannot drift from the tokens.
      #
      # preview/tokens.generated.css is generated. Edit a token, forget to
      # regenerate, and the preview quietly shows the old system to whoever is
      # reviewing the new one. Verified by QA: a one-line token change with no
      # regeneration fails here.
      # ---------------------------------------------------------------------
      - name: Preview is in sync with the tokens
        run: |
          node tools/build-preview.mjs
          if ! git diff --exit-code -- preview/; then
            echo "::error::preview/ is out of date. A token changed and the preview was not regenerated. Run \`npm run preview\` and commit the result."
            exit 1
          fi

      # The tree must be clean overall, not just under preview/. A generator that
      # writes anywhere else is a generator whose output nobody is reviewing.
      - name: Nothing else was generated
        run: |
          if ! git diff --exit-code; then
            echo "::error::the build wrote files outside preview/. Commit them or stop generating them."
            exit 1
          fi

      - name: Upload the contrast report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: contrast.txt
          retention-days: 14
          if-no-files-found: ignore

  ci-ok:
    name: ci-ok
    needs: [changes, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate gated results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT code=$CODE tests=$TESTS_RESULT"
          # Change detection must really have run: if it failed or was skipped, the gated job is
          # skipped too and the aggregate would pass without testing anything.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::change detection ended '$CHANGES_RESULT'"
            exit 1
          fi
          case "$CODE" in
            true)
              if [ "$TESTS_RESULT" != "success" ]; then
                echo "::error::code changed and tests ended '$TESTS_RESULT'"
                exit 1
              fi
              ;;
            false)
              # Docs-only: tests are skipped on purpose; a run that happened must still be green.
              if [ "$TESTS_RESULT" != "skipped" ] && [ "$TESTS_RESULT" != "success" ]; then
                echo "::error::tests ended '$TESTS_RESULT'"
                exit 1
              fi
              ;;
            *)
              echo "::error::change detection produced no verdict ('$CODE')"
              exit 1
              ;;
          esac
          echo "ci-ok: every needed job succeeded or was skipped on purpose"
